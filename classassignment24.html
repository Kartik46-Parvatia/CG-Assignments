<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>Registration Form</h1><br><br>
        <label for="first name">First Name :</label>
        <input for="text" placeholder="Enter First name" id="first name" name="first name"><br><br>
        
        <label for="last name">Last Name :</label>
        <input type="text" placeholder="Enter Last Name" id="last name" name="last name"><br><br>

        <label for="Email">E-Mail :</label>
        <input type="email" placeholder="Enter Email Address" id="email" name="email"><br><br>

        <label for="pass">Password :</label>
        <input type="password" id="pass" name="pass"><br><br>

        <label for="gender">Gender :</label><br><br>
        <label for="gender">Male</label>
        <input type="radio" id="gender" name="gender"><br><br>
        <label for="gender">Female</label>
        <input type="radio" id="gender" name="gender"><br><br>
        <label for="gender">other</label>
        <input type="radio" id="gender" name="gender"><br><br>
        <label for="age">Age :</label>
        <input type="number" id="age" name="age" max="99" min="1"><br><br>
        <label for="prefrences">Prefrences :</label><br><br>
        <label for="color">Acrylic Painting</label>
        <input type="checkbox" id="color" name="color"><br><br>
        <label for="color">Oil Painting</label>
        <input type="checkbox" id="color" name="color"><br><br>
        <label for="color">Water Color Painting</label>
        <input type="checkbox" id="color" name="color"><br><br>

        <label for="occupation">Select Occupation</label>
        <select name="status">
        <option value="occupation">Student</option>
        <option value="occupation">Government Servant</option>
        <option value="occupation">Private Job</option>
        <option value="occupation">Business</option>
        <option value="occupation">Unemployed</option>
        </select><br><br>

        <label for="bio">Bio</label>
        <textarea rows="7" cols="45" placeholder="Share Few Lines About Yourself...."></textarea><br><br>

        <button type="reset">Reset</button>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
